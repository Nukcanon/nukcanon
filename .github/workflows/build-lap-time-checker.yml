name: Build LapTimeChecker Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android-source/LapTimeChecker-Android-1.1.0.zip"
      - ".github/workflows/build-lap-time-checker.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Unpack project
        run: |
          mkdir project
          unzip -q android-source/LapTimeChecker-Android-1.1.0.zip -d project
          chmod +x project/gradlew
      - name: Build debug APK
        working-directory: project
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LapTimeChecker-Android-1.1.0-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
