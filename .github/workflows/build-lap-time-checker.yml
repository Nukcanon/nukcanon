name: Build LapTimeChecker Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android-build/LapTimeChecker-Android-1.3.0-source.zip"
      - ".github/workflows/build-lap-time-checker.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Unpack source
        run: unzip -q android-build/LapTimeChecker-Android-1.3.0-source.zip -d source
      - name: Build debug APK
        working-directory: source/work/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LapTimeChecker-Android-1.3.0
          path: |
            source/work/android/app/build/outputs/apk/debug/app-debug.apk
            android-build/LapTimeChecker-Android-1.3.0-source.zip
          if-no-files-found: error
