name: Install updated Internal N Crush 1.1.4
on:
  push:
    branches: [main]
    paths:
      - '.github/internal-n-crush-release.json'
      - '.github/scripts/update_internal_n_crush.py'
      - '.github/workflows/update-internal-n-crush.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: install-internal-n-crush-1.1.4
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer integrity regressions
        run: python3 .github/scripts/test_update_internal_n_crush.py
      - name: Install verified web release
        run: python3 .github/scripts/update_internal_n_crush.py --refresh-release
      - name: Commit game files and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play internal-n-crush.html internal-n-crush-version.json .github/internal-n-crush-release.json
          git diff --cached --quiet || git commit -m 'Publish verified Internal N Crush 1.1.4 web build'
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
