<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- CSP(공통 6절, 검토 29): 스크립트·자료는 같은 출처만(틀 안 스크립트 1개는 inline), wasm 실행 허용, 연결은 같은 출처 + 인터넷 로비(https·wss) + 이 PC 시험 로비. WebRTC(STUN)는 CSP 대상 아님 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://nuklear-vanguard-lobby.internal-n-crush-directory.workers.dev wss://nuklear-vanguard-lobby.internal-n-crush-directory.workers.dev http://127.0.0.1:8790 ws://127.0.0.1:8790; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>NUKLEAR VANGUARD</title>
<!-- NUKLEAR VANGUARD 웹판(바로하기) 틀. INC game/web_shell.html을 바탕으로:
     - 「게임 시작」 누름 = 브라우저 소리 허용(첫 입력 전 소리 금지)과 화면 포커스.
     - 화면 오른쪽 위 구석 「전체 화면」 단추(공통 이름). 전체 화면 동안 navigator.keyboard.lock(['Escape'])로
       Esc를 게임이 받는다(Chrome·Edge·Opera, https). 끝낼 때는 Esc 길게 누르기(브라우저 기본) 또는 단추.
     - 잠글 수 없는 브라우저(Firefox·Safari)에서 Esc로 전체 화면이 풀리면 게임에 window.nvOnFullscreenLost()를
       알린다(게임이 JavaScriptBridge로 등록해 두면 일시정지 메뉴를 연다 — 게시_준비.md 「코드 담당」). -->
<style>
:root{--bg:#0b0e14;--panel:#141a24;--line:#2c3646;--ink:#eef2f7;--muted:#a9b4c4;--accent:#f0b23a;--accent-ink:#1b1305;--warn:#5b3943}
html,body,#canvas{margin:0;padding:0;border:0}
body{color:var(--ink);background:var(--bg);overflow:hidden;touch-action:none;font-family:system-ui,"Malgun Gothic",sans-serif}
#canvas{display:block}
#canvas:focus{outline:none}
#status,#status-splash,#status-progress{position:absolute;left:0;right:0}
#status,#status-splash{top:0;bottom:0}
#status{background-color:#242424;display:flex;flex-direction:column;justify-content:center;align-items:center;visibility:hidden}
#status-splash{max-height:100%;max-width:100%;margin:auto}
#status-splash.show-image--false{display:none}
#status-splash.fullsize--true{height:100%;width:100%;object-fit:contain}
#status-splash.use-filter--false{image-rendering:pixelated}
#status-progress,#status-notice{display:none}
#status-progress{bottom:10%;width:50%;margin:0 auto}
#status-notice{background:var(--warn);border-radius:.5rem;border:1px solid #9b3943;color:#e0e0e0;line-height:1.5;margin:0 2rem;padding:1rem;text-align:center;z-index:1}
#launch{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg);text-align:center;padding:16px;overflow-y:auto;touch-action:pan-y;box-sizing:border-box}
.launch-card{width:min(100%,560px);margin:auto}
#launch h1{letter-spacing:.12em;font-size:clamp(24px,5vw,40px);margin:0 0 8px}
#launch p{color:var(--muted);line-height:1.7;margin:10px 0}
#start{width:100%;min-height:52px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;font-size:20px;font-weight:800;cursor:pointer}
#start:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.keys{margin:16px 0 0;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:left;font-size:14px;line-height:1.8;color:var(--muted)}
.keys b{color:var(--ink)}
#touch-note{display:none;color:#ffcf7a}
@media (pointer:coarse){#touch-note{display:block}}
#fullscreen{position:fixed;top:max(6px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));z-index:5;min-height:32px;padding:4px 12px;border:1px solid #8a97a877;border-radius:6px;background:#141a24b3;color:var(--ink);font-size:12px;cursor:pointer;opacity:.85;transition:opacity .4s}
#fullscreen.idle{opacity:.18}
#fullscreen:hover,#fullscreen:focus-visible{opacity:1}
#toast{position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:6;padding:8px 14px;border-radius:6px;background:#141a24e6;color:var(--ink);font-size:14px;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<div id="launch"><div class="launch-card">
<h1>NUKLEAR VANGUARD</h1>
<p>처음 실행할 때 게임 파일을 내려받습니다(약 <span id="dl-size">수십</span> MB).<br>키보드로 하는 게임입니다.</p>
<p id="touch-note">휴대폰·태블릿은 화면 조작이 없습니다. 키보드를 연결하거나 PC에서 해 주세요.</p>
<button id="start">게임 시작</button>
<p id="start-error" role="status"></p>
<div class="keys"><b>조작</b> W·A·S·D 이동 · J 쏘기 · K 점프 · L 수류탄 · I 기술 · Esc 일시정지 (환경 설정 → 키 설정에서 방향키 방식으로 바꿀 수 있음)<br>
<b>전체 화면</b> 오른쪽 위 단추. 전체 화면에서 끝내려면 <b>Esc를 길게</b> 누르거나 단추를 누르세요.</div>
</div></div>
<button id="fullscreen" type="button" aria-label="전체 화면" aria-pressed="false">전체 화면</button>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="canvas">이 브라우저는 canvas를 지원하지 않습니다.</canvas>
<noscript>이 게임은 JavaScript가 필요합니다.</noscript>
<div id="status">
<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
<progress id="status-progress"></progress>
<div id="status-notice"></div>
</div>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":81966008,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') { statusOverlay.remove(); initializing = false; return; }
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}
	function setStatusNotice(text) {
		statusNotice.replaceChildren();
		text.split('\n').forEach((line) => { statusNotice.appendChild(document.createTextNode(line)); statusNotice.appendChild(document.createElement('br')); });
	}
	function displayFailureNotice(err) {
		const launch = document.getElementById('launch');
		if (launch) launch.remove();
		console.error(err);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : '');
		setStatusNotice('게임을 시작하지 못했습니다. 페이지를 새로 고쳐 주세요.\n최신 Chrome·Edge·Firefox를 권장합니다.' + (msg ? '\n(' + msg + ')' : ''));
		setStatusMode('notice');
		initializing = false;
	}

	// 내려받을 크기 표시(GODOT_CONFIG.fileSizes: wasm + pck)
	try {
		const sizes = GODOT_CONFIG.fileSizes || {};
		const total = Object.values(sizes).reduce((a, b) => a + (Number(b) || 0), 0);
		if (total > 0) document.getElementById('dl-size').textContent = String(Math.round(total / 1048576));
	} catch (e) { /* 표시만 */ }

	// ---- 토스트(같은 자리·같은 모양) ----
	const toast = document.getElementById('toast');
	let toastTimer = 0;
	function notify(text) {
		toast.textContent = text;
		toast.classList.add('on');
		clearTimeout(toastTimer);
		toastTimer = setTimeout(() => toast.classList.remove('on'), 3500);
	}

	// ---- 전체 화면 + Esc 잠금(공통 규칙 8절, 키보드 샷건 fullscreen.ts와 같은 흐름) ----
	const fsBtn = document.getElementById('fullscreen');
	const root = document.documentElement;
	const kb = navigator.keyboard;
	const canLock = !!(kb && kb.lock && window.isSecureContext);
	let locked = false, wasOn = false, byButton = false, announced = false;
	if (!document.fullscreenEnabled || typeof root.requestFullscreen !== 'function') fsBtn.remove();
	function focusGame() { const c = document.getElementById('canvas'); if (c) c.focus(); }
	function enterFullscreen() {
		return root.requestFullscreen().catch(() => notify('전체 화면을 켤 수 없습니다. 브라우저 설정을 확인하세요.'));
	}
	fsBtn.addEventListener('click', () => {
		if (document.fullscreenElement) { byButton = true; document.exitFullscreen().catch(() => { byButton = false; }); }
		else enterFullscreen();
		focusGame();                       // 단추가 키 입력을 가져가지 않게
	});
	function syncFullscreen() {
		const on = !!document.fullscreenElement;
		fsBtn.textContent = on ? '전체 화면 끄기' : '전체 화면';
		fsBtn.setAttribute('aria-label', fsBtn.textContent);
		fsBtn.setAttribute('aria-pressed', String(on));
		if (on) {
			locked = false;
			if (canLock) kb.lock(['Escape']).then(() => { locked = !!document.fullscreenElement; }, () => { locked = false; });
			if (!announced) { announced = true; notify(canLock ? '전체 화면을 끝내려면 Esc를 길게 누르세요' : '전체 화면을 끝내면 일시정지됩니다'); }
		} else {
			if (canLock) { try { kb.unlock(); } catch (e) { /* 무시 */ } }
			// Esc 잠금 없이 단추가 아닌 방법(대개 Esc)으로 풀림 → 게임에 알림(일시정지 메뉴)
			if (wasOn && !locked && !byButton && typeof window.nvOnFullscreenLost === 'function') {
				try { window.nvOnFullscreenLost(); } catch (e) { console.warn(e); }
			}
			locked = false; byButton = false;
		}
		wasOn = on;
		focusGame();
	}
	document.addEventListener('fullscreenchange', syncFullscreen);
	// 단추는 마우스가 3초 멈추면 흐리게(화면을 가리지 않게), 움직이면 다시 또렷하게
	let idleTimer = 0;
	function wake() { fsBtn.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => fsBtn.classList.add('idle'), 3000); }
	document.addEventListener('pointermove', wake, { passive: true });
	wake();
	// 게임(GDScript)에서 부를 수 있게: JavaScriptBridge.eval("nvToggleFullscreen()") — 사용자 입력 처리 중에만 브라우저가 허용
	window.nvToggleFullscreen = () => { if (document.fullscreenElement) { byButton = true; document.exitFullscreen().catch(() => { byButton = false; }); } else enterFullscreen(); };
	window.nvIsFullscreen = () => !!document.fullscreenElement;

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('이 브라우저에 필요한 기능이 없습니다: ' + missing.join(', '));
		return;
	}
	const startButton = document.getElementById('start');
	startButton.focus();
	startButton.onclick = () => {
		startButton.disabled = true;
		document.getElementById('launch').remove();
		setStatusMode('progress');
		engine.startGame({
			onProgress: function (current, total) {
				if (current > 0 && total > 0) { statusProgress.value = current; statusProgress.max = total; }
				else { statusProgress.removeAttribute('value'); statusProgress.removeAttribute('max'); }
			},
		}).then(() => { setStatusMode('hidden'); focusGame(); }, displayFailureNotice);
	};
}());
</script>
</body>
</html>
